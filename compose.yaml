services:
    cellbro-app:
        container_name: cellbro-app
        build:
            dockerfile: ./services/cellbro-app/Dockerfile
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
                restart: true
            # tailwind-compiler:
            #     condition: service_healthy
        environment:
            TZ: ${TIMEZONE}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRES_PORT: ${POSTGRES_PORT}
            REDIS_PORT: ${REDIS_PORT}
            REDIS_HOST: "redis-cache"
        volumes:
            - ./src/cellbro-server:/app/cellbro-server:z
            - ./src/cellbro-db:/app/cellbro-db:z
            - ./src/cellbro-worker:/app/cellbro-worker:z
            - ./services/cellbro-app/templates:/app/templates:ro
            - ./services/cellbro-app/static/js:/static/js:ro
            - compiled_css:/static/style/compiled
            - ./data:/app/data:z
    cellbro-worker:
        container_name: cellbro-worker
        build:
            dockerfile: ./services/cellbro-worker/Dockerfile
        env_file: .env
        environment:
            TZ: ${TIMEZONE}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRES_PORT: ${POSTGRES_PORT}
            REDIS_PORT: ${REDIS_PORT}
            REDIS_HOST: "redis-cache"
        volumes:
            - ./src/cellbro-worker:/app/cellbro-worker:z
            - ./src/cellbro-db:/app/cellbro-db:z
            - ./data:/app/data:z
        depends_on:
            postgres:
                condition: service_healthy
                restart: true
        restart: on-failure
        command: taskiq worker cellbro_worker.broker:broker --reload --workers 1

    postgres:
        container_name: cellbro-postgres
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGPORT: ${POSTGRES_PORT}
            TZ: ${TIMEZONE}
        expose:
            - ${POSTGRES_PORT}
        ports:
            - ${POSTGRES_PORT}:${POSTGRES_PORT}
        restart: on-failure
        volumes:
            - ./templates/postgresql.conf:/etc/postgresql.conf
            # - ${DB_DIR}/postgres:/var/lib/postgresql/data:z
            # - ${DB_DIR}/archive:/var/lib/postgresql/archive:z
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
            interval: 10s
            timeout: 10s
            retries: 5
        command: "postgres -c config_file=/etc/postgresql.conf"

    # pgadmin:
    #     container_name: pgadmin
    #     image: dpage/pgadmin4:latest
    #     environment:
    #         PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
    #         PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    #         TZ: ${TIMEZONE}
    #     ports:
    #         - ${PGADMIN_PORT}:80
    #     restart: on-failure
    #     volumes:
    #         - ${DB_DIR}/pgadmin:/var/lib/pgadmin
    #     depends_on:
    #         postgres:
    #             condition: service_healthy
    #             restart: true
    #     attach: false  # no logs

    redis-cache:
        container_name: cellbro-redis
        image: redis:8.0.3-alpine3.21
        ports:
            - ${REDIS_PORT}:${REDIS_PORT}
        restart: on-failure
        environment:
            TZ: ${TIMEZONE}
        healthcheck:
            test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
            interval: 10s
            timeout: 10s
            retries: 5
        command: --port ${REDIS_PORT}

    tailwind-compiler:
        container_name: tailwind-compiler
        tty: true
        build:
          context: .
          dockerfile: ./services/tailwind-compiler/Dockerfile
        volumes:
            - ./services/cellbro-app/static/style:/app/style
            - ./services/cellbro-app/templates:/app/templates
            - compiled_css:/app/static/style/compiled
        environment:
            - TZ=${TIMEZONE}
        command: "npx @tailwindcss/cli -i /app/style/style.css  -o /app/static/style/compiled/style.css --watch"

volumes:
    compiled_css: