{% from "macros/button.jinja2" import confirm_action_button %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/static/favicon.png" sizes="any" type="image/png">
    <title>CellBro</title>

    <!-- htmx -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-ws@2.0.4" integrity="sha384-1RwI/nvUSrMRuNj7hX1+27J8XDdCoSLf0EjEyF69nacuWyiJYoQ/j39RT1mSnd2G" crossorigin="anonymous"></script>

    <!-- Custom CSS -->
    <link href="{{ url_for('static', path='style/compiled/style.css') }}" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"/>
</head>

<body>

    <div class="drawer lg:drawer-open">
        <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
        <div class="drawer-content flex flex-col min-h-screen">
            <nav class="navbar w-full bg-base-300">
                <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
                </label>
                <div class="px-4">CellBro</div>

                <div class="hidden flex-none lg:block">
                    <ul class="menu menu-horizontal">
                        <li>
                            <a {% if active_page == 'home-page' %}class="menu-active"{% endif %} href="/">
                                <i class="bi bi-house"></i>
                                <span class="dock-label">Home</span>
                            </a>
                        </li>
                        <li>
                            <a {% if active_page == 'users-page' %}class="menu-active"{% endif %} href="{{ url_for('users') }}">
                                <i class="bi bi-person-circle"></i>
                                <span class="dock-label">Users</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="w-full grow">
                <div class="flex flex-col h-full">
                    <div class="p-4 w-full grow">{% block content %}{% endblock %}</div>

                    <div x-data="{ open: true, lastLine: 'Waiting for output...' }" class="block w-full bg-neutral text-neutral-content" hx-ext="ws" ws-connect="/api/ws/output/general">
                        <div class="mockup-code w-full relative transition-all duration-300 rounded-none" 
                            :class="open ? 'h-64' : 'h-12 overflow-hidden'" id="terminal-container">
                            
                            <button @click="open = !open" class="btn btn-xs btn-circle btn-ghost absolute right-4 top-3 z-20">
                                <i class="bi text-white" :class="open ? 'bi-dash-lg' : 'bi-plus-lg'"></i>
                            </button>

                            <!-- Main Terminal Body -->
                            <div x-show="open" 
                                id="stdout" 
                                hx-swap="beforeend" 
                                class="h-full overflow-y-auto scroll-smooth"
                                x-init="
                                    new MutationObserver(() => {
                                        // 1. Update the lastLine variable for the minimized view
                                        // We grab the text of the last child inside stdout
                                        if ($el.lastElementChild) {
                                            lastLine = $el.lastElementChild.innerText.replace('$', '').trim();
                                        }

                                        // 2. Smart Scroll logic
                                        const threshold = 100;
                                        const isAtBottom = $el.scrollHeight - $el.clientHeight - $el.scrollTop < threshold;
                                        if (isAtBottom) {
                                            $el.scrollTo({ top: $el.scrollHeight, behavior: 'smooth' });
                                        }
                                    }).observe($el, { childList: true, subtree: true })
                                ">
                                <pre data-prefix="$"><code>Waiting for output...</code></pre>
                            </div>

                            <!-- Minimized View: Now displays the lastLine variable -->
                            <div x-show="!open" class="opacity-50 h-full flex items-center">
                                <pre class="m-0 truncate"><code x-text="lastLine"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="drawer-side is-drawer-close:overflow-visible">
            <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
            <div class="flex min-h-full flex-col items-start bg-base-200 is-drawer-close:w-14 is-drawer-open:w-64">
            <!-- Sidebar content here -->
            <ul class="menu w-full grow">
                <!-- List item -->
                <li>
                <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Homepage">
                    <!-- Home icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    <span class="is-drawer-close:hidden">Homepage</span>
                </button>
                </li>

                <!-- List item -->
                <li>
                <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Settings">
                    <!-- Settings icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>
                    <span class="is-drawer-close:hidden">Settings</span>
                </button>
                </li>
            </ul>
            </div>
        </div>
    </div>

    <div x-data="toastManager" 
        class="toast toast-end toast-bottom z-[9999] items-end"
        @flash.window="add($event.detail.category, $event.detail.message)">
        
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="translate-y-4 opacity-0"
                x-transition:enter-end="translate-y-0 opacity-100"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"
                :class="{
                    'alert shadow-lg mb-2 flex justify-between w-auto min-w-[200px]': true,
                    'alert-error': toast.category === 'error',
                    'alert-success': toast.category === 'success',
                    'alert-warning': toast.category === 'warning',
                    'alert-info': toast.category === 'info'
                }">
                
                <span x-text="toast.message"></span>

                <button class="btn btn-sm btn-circle btn-ghost ml-4" @click="remove(toast.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </template>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('toastManager', () => ({
                toasts: [],
                
                add(category, message) {
                    const id = Date.now() + Math.random();
                    const isPersistent = (category === 'error' || category === 'danger');
                    
                    this.toasts.push({ id, category, message, visible: true });

                    if (!isPersistent) {
                        setTimeout(() => this.remove(id), 3000);
                    }
                },

                remove(id) {
                    const index = this.toasts.findIndex(t => t.id === id);
                    if (index > -1) {
                        this.toasts[index].visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }
                }
            }));
        });

        function render_flash_messages() {
            fetch("{{ url_for('retrieve_flash_messages') }}")
                .then(res => res.json())
                .then(data => {
                    const messages = Array.isArray(data) ? data : (data?.messages || []);
                    messages.forEach(([category, message]) => {
                        window.dispatchEvent(new CustomEvent('flash', { 
                            detail: { category, message } 
                        }));
                    });
                });
        }

        // HTMX integration
        document.addEventListener("htmx:afterRequest", (e) => {
            if (!e.detail.xhr.getResponseHeader("HX-Redirect")) {
                render_flash_messages();
            }
        });

        // Initial load
        document.addEventListener("DOMContentLoaded", render_flash_messages);
    </script>
</body>
</html>
