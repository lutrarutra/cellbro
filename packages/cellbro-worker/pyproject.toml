[build-system]
requires = ["setuptools>=70.1", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cellbro-worker"
version = "0.1"
description = "Microservice worker for CellBro"
authors = [
    { name = "lutrarutra", email = "lutrarutra@pm.me" }
]
requires-python = ">=3.11"

dependencies = [
    "taskiq[reload]",
    "taskiq-redis",
    "psycopg[binary] >= 3.2",
    "SQLAlchemy >= 2.0",
    "pytz >= 2023.3",
    "tzlocal >= 5.2",
    "redis",
    "anndata",
    "scanpy",
    "numpy >= 2.2",
    "pandas >= 2.3",
    "bokeh"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cellbro_worker*"]

[tool.flake8]
max-line-length = 88
exclude = [
    ".git",
    "__pycache__",
]
extend-ignore = ["E501", "W292", "W293"]

